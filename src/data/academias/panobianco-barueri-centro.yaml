- Abre das 5h às 23h59 de segunda a quinta e até 23h na sexta. Funciona também no sábado, das 8h às 17h, e no domingo, das 8h às 14h.
- A lista de estrutura da página é a mais longa entre as academias de Barueri reunidas aqui, com área infantil, elevador, itens de acessibilidade e nutricionista. No Wellhub, o acesso começa no plano Basic, ao menos dois níveis abaixo do exigido pelas unidades de rede de Alphaville.
