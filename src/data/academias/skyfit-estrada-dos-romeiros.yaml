divergencias:
- 'Quinta-feira: o Wellhub informa abertura às 6h; o TotalPass, às 5h. A ficha usa o horário mais tarde.'
- 'Bairro: o TotalPass diz Vila São Silvestre (CEP 06417-000); o Wellhub, Jardim Regina Alice (CEP 06412-180).'
pendencias:
- Mensalidade direta (o site da rede mostra os planos só no fluxo de matrícula)
- Grade de aulas coletivas
analise:
- 'É uma academia de rede focada em musculação e cardio, na Estrada dos Romeiros, do lado de Barueri que vai para Santana de Parnaíba. Abre das 5h às 23h nos dias úteis (na quinta, a partir das 6h segundo o Wellhub), das 8h às 17h no sábado e das 8h às 14h no domingo.'
- 'Nos agregadores, é das entradas mais baratas da região: TP 1+ no TotalPass (R$ 89,90 por mês) e Basic+ no Wellhub (R$ 99,99). O TotalPass informa estacionamento pago.'
