analise:
- 'É um estúdio dedicado a treinamento funcional, no 1º andar do mesmo prédio da SIX, na Av. Copacabana, no Empresarial 18 do Forte. O TotalPass lista funcional, circuito funcional e treinamento funcional, e uma estrutura de alto padrão para o tamanho: sauna, toalhas, manobrista e cadeira de massagem.'
- Abre das 6h às 21h nos dias úteis e das 9h ao meio-dia no sábado; no domingo, fecha. No TotalPass, entra pelo TP 5 (R$ 399,90 por mês), uma das entradas mais altas da região.
