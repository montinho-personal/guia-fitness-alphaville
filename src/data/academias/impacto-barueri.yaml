analise:
- Fica na Rua Bélgica, na Vila Engenho Novo, perto do limite com Santana de Parnaíba. Abre às 5h e fecha às 22h de segunda a sexta; no sábado funciona das 8h às 14h, e não há horário listado para domingo.
- A grade mistura musculação com boxe, muay thai, artes marciais e cross training. A lista de estrutura é curta — armários, vestiário, loja e Wi-Fi. No Wellhub, entra a partir do plano Basic+, um dos níveis de entrada mais baixos entre as academias do guia.
