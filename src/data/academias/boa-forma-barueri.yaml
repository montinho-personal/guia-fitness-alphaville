analise:
- É a única academia do guia que informa piscina, com natação para adultos, hidroginástica e hidroterapia na grade. Para quem procura academia com piscina em Barueri, é a opção a conferir primeiro.
- Funciona das 7h às 22h de segunda a sexta (21h30 na segunda) e das 8h às 13h no sábado; não há horário listado para domingo. A página informa estacionamento e espaço adaptado para cadeira de rodas. No Wellhub, o acesso começa no plano Silver+. O número do endereço aparece de dois jeitos na mesma página, 73 e 120, na Rua Dr. Francis D Hornet.
