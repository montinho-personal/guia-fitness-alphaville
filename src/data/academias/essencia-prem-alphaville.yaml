analise:
- É um estúdio só de yoga, no prédio da Praça dos Gerânios, no Centro Comercial Alphaville, perto do Iguatemi. O Wellhub lista hatha, vinyasa flow, slow flow, yoga ativo e kriya hatha yoga, e informa tapete de ioga e área de alongamento.
- 'Nos agregadores, é entrada alta: Gold no Wellhub (R$ 319,99 por mês) e TP 4 no TotalPass (R$ 299,90). Os horários diferem entre as duas fontes; confirme a aula antes de ir.'
