analise:
- 'É um box, não uma academia de musculação: o treino acontece em aulas com horário marcado. Segundo o Wellhub, há turmas das 6h às 13h e de novo no fim da tarde, até 20h30; no sábado e no domingo há uma janela curta pela manhã.'
- As duas fontes consultadas divergem. O Wellhub lista a unidade com o nome "Hybrid Fitness" e informa pausa no meio da tarde; o TotalPass usa o nome "Templo SA – CrossFit" e mostra horário contínuo das 6h às 20h30. Antes de ir, confirme a grade de aulas diretamente com o box.
