analise:
- Abre às 4h de segunda a sexta, o horário de abertura mais cedo entre as academias deste guia que não funcionam 24 horas, e fecha às 22h. No sábado funciona das 8h às 14h. Não há horário listado para domingo.
- Além da musculação, a grade inclui muay thai, jiu-jitsu e dança. No Wellhub, o acesso começa no plano Basic. O TotalPass também lista uma unidade Mattos Fitness no mesmo número da Tenente Marques; não confirmamos se o cadastro é da mesma academia.
