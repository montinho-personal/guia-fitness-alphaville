analise:
- Fica dentro do Parque Shopping Barueri, no bairro Nova Aldeinha, entre o centro de Barueri e Alphaville. Abre às 5h e fecha à meia-noite de segunda a sexta; no sábado funciona das 8h às 17h e no domingo e em feriados, das 8h às 14h.
- O Plano Fit custa R$ 139,90 por mês com fidelidade e vale só para esta unidade; o Black, a R$ 159,90, dá acesso a toda a rede. Estar num shopping tende a facilitar o estacionamento, mas a página da unidade não informa se há convênio para alunos.
