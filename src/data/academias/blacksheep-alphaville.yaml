analise:
- Fica no mesmo conjunto de galpões do Templo SA, na Alameda Araguaia, 122. Funciona das 6h às 20h30 de segunda a quinta e até 19h30 na sexta; no fim de semana há uma janela das 9h às 10h30.
- É a única unidade deste guia que lista Hyrox entre as atividades, ao lado de cross training e treino funcional. A página informa estacionamento, área de pesos livres e personal trainer. No Wellhub, o acesso exige o plano Gold+.
- 'A rede publica a tabela de planos no site: o ilimitado custa R$ 480 por mês em contrato trimestral ou mais longo, a aula avulsa sai por R$ 75 e há um mês de teste a R$ 400 para novos alunos. Em Alphaville, a unidade oferece o Hybrid, treino voltado a provas de Hyrox; a rede informa que o Hyrox Training Club oficial fica na unidade Moema.'
