analise:
- 'Junta jiu-jitsu com duas artes de defesa pessoal pouco comuns na região, o krav magá e o hapkido. Fica na Rua Tiradentes, no Jardim Belval, bairro que dá nome a uma das estações da Linha 8-Diamante em Barueri.'
- 'O horário publicado é mais cheio no começo da semana: de segunda a quarta abre de manhã e à noite; quinta e sexta, só à noite. No sábado, uma janela das 10h30 ao meio-dia. No Wellhub, entra pelo Basic, um dos planos mais baratos.'
