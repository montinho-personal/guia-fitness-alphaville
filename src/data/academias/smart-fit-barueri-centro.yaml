analise:
- Funciona das 5h à meia-noite de segunda a sexta, das 8h às 17h no sábado e das 8h às 14h no domingo e em feriados. Abre uma hora mais cedo e fecha uma hora mais tarde que a unidade da Sodimac, em Alphaville.
- O Plano Fit, o mais barato da rede, custa R$ 139,90 por mês com fidelidade e dá acesso só a esta unidade. Quem quer treinar também em outras Smart Fit precisa do Plano Black, a R$ 159,90. A grade inclui musculação, bike e ginástica, e o site oferece um indicador de ocupação da unidade em tempo real.
