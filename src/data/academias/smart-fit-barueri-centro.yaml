- Funciona das 5h às 23h59 de segunda a sexta, das 8h às 17h no sábado e das 8h às 14h no domingo. Abre uma hora mais cedo e fecha uma hora mais tarde que a unidade Alphaville II da mesma rede.
- A grade inclui musculação, bike e ginástica. Pelo TotalPass, o acesso começa no plano TP 1+, o nível de entrada mais baixo entre as academias deste guia listadas nesse agregador.
