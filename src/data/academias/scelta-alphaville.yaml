analise:
- Abre às 5h30 em dias úteis e fecha às 23h. No sábado funciona das 8h às 16h, e no domingo, das 9h às 14h.
- 'A página da unidade lista uma estrutura de serviços maior que a média: cafeteria, loja, toalhas de banho, fisioterapeuta e personal trainer, além de estacionamento. No Wellhub, o acesso começa no plano Gold, acima do exigido pelas academias de rede da região. No TotalPass, entra pelo TP 4, e a página de lá acrescenta jiu-jitsu, muay thai e boxe chinês à grade.'
