- 'A grade listada mistura musculação com aulas de bike e coletivas, como Aeropower e Body Jam. No Wellhub, entra pelo Basic, a mesma entrada barata da unidade do centro. A mensalidade praticada aqui não foi publicada nas fontes consultadas.'
