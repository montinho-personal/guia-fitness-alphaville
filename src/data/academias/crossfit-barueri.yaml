analise:
- Apesar do nome, o endereço listado fica em Alphaville Industrial, na Av. Juruá, e não no centro de Barueri. Funciona das 6h às 22h30 de segunda a quinta, até 21h30 na sexta e das 7h às 12h no sábado. Não há horário listado para domingo.
- Entre os boxes reunidos aqui, é o que tem a janela mais longa em dias úteis. A página informa estacionamento, vestiário e loja. No Wellhub, o acesso começa no plano Gold.
