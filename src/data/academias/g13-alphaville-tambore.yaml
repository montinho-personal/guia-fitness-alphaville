analise:
- 'É uma escola de luta, não academia de musculação. A G13 é uma equipe de jiu-jitsu com unidades pelo país, e a de Alphaville fica no Tamboré III, do lado de Santana de Parnaíba, na mesma avenida que liga o Tamboré à Fazendinha. O site informa estacionamento gratuito.'
- 'O plano dá acesso livre a jiu-jitsu, muay thai e boxe, sem limite de aulas por dia, e a matrícula é por plano semestral ou anual. Há turmas kids (3 a 10 anos), teens (11 a 15), adultos, para mulheres e para competição, e a aula experimental é gratuita.'
