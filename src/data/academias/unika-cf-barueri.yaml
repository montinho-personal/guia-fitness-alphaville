analise:
- 'É o box por trás das buscas por CrossFit na Rua da Prata, no Jardim dos Camargos, em Barueri. O Wellhub lista CrossFit e CrossFit infantil, com horário das 6h às 22h nos dias úteis e uma janela curta no sábado e no domingo de manhã.'
- 'Nos agregadores, entra pelo TP 3 no TotalPass; no Wellhub, a página mostra Silver como entrada, mas indica o CrossFit a partir do Gold. Como em todo box, o horário é de aula com turma: confirme a grade antes de ir.'
