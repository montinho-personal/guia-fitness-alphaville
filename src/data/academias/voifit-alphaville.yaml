analise:
- Fica na Av. Alphaville, dentro do Empresarial 18 do Forte. Nos dias úteis abre às 6h e fecha às 23h; no sábado e no domingo o horário é reduzido, mas a academia não fecha.
- Além da musculação, a grade listada tem muay thai, jiu-jitsu, bike, funcional e pilates de solo. A página da unidade informa estacionamento, ar-condicionado e espaço adaptado para cadeira de rodas. No Wellhub, o acesso começa no plano Silver.
