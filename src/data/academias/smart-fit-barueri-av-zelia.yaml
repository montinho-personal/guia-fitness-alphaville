analise:
- Fica no Parque dos Camargos, na região sul de Barueri, longe do centro e de Alphaville. Funciona das 5h às 23h de segunda a sexta, das 8h às 17h no sábado e em feriados e das 8h às 14h no domingo. É a única das quatro Smart Fit da região que fecha às 17h nos feriados, e não às 14h.
- 'Os preços são os mesmos das outras unidades de Barueri: Plano Fit a R$ 139,90 por mês com fidelidade, válido só nesta academia, e Plano Black a R$ 159,90, com acesso a toda a rede. A estrutura informada no site é a padrão da marca, e não inclui estacionamento.'
