analise:
- 'O endereço merece atenção: a academia fica no 2º pavimento do estacionamento da Sodimac, na Alameda Araguaia, 1801. Funciona das 6h às 23h de segunda a sexta, das 8h às 17h no sábado e das 8h às 14h no domingo.'
- 'A grade listada é a padrão da rede: musculação, alongamento, abdominais e aulas curtas de alta intensidade. Pelo TotalPass, o acesso começa no plano TP 2. Esta ficha cobre apenas a unidade II; as demais unidades da Smart Fit na região ainda não foram conferidas.'
