divergencias:
- 'Endereço: o site oficial informa Estrada da Aldeinha, 181, no Jardim Santa Cecília; o TotalPass usa o mesmo número, mas indica o bairro Alphaville Empresarial.'
- 'Horário: o site oficial diz 24 horas, inclusive em feriados; o TotalPass mostra uma janela das 0h às 0h30, que parece erro de cadastro.'
pendencias:
- Valor da aula avulsa
- Valor cobrado de personal trainer externo
analise:
- 'É, de longe, a maior academia do guia em área declarada: o site da rede fala em 32 mil m², com estacionamento gratuito para mais de mil carros, e a apresenta como o maior centro de treinamento de musculação do mundo. Fica na Estrada da Aldeinha, já fora dos bairros residenciais de Alphaville, com acesso pela rodovia.'
- 'Funciona 24 horas, inclusive em feriados, segundo o site oficial. O foco é só musculação, sem grade de aulas coletivas. Os preços são os mesmos em todas as unidades da rede: R$ 399 por mês no plano de 12 meses, R$ 499 no de 6 meses e R$ 599 no recorrente, sempre com matrícula de R$ 120.'
- 'Para quem treina com personal, a Ironberg é uma das poucas da região que publica a regra: personal externo pode atender no espaço pagando um valor fixo à academia, e não por aula ou por aluno. O valor é informado só na unidade.'
