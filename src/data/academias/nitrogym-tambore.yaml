perguntas:
- p: Quanto custa treinar na NitroGym Tamboré?
  r: 'Segundo o site oficial, R$ 389 por mês no plano anual, R$ 489 no semestral e R$ 589 no mensal, todos com cobrança recorrente. Há também plano só de fim de semana, a R$ 289 por mês, e diária de R$ 90, paga no local.'
- p: Tem academia no Shopping Tamboré?
  r: 'Sim. A NitroGym fica dentro do Shopping Tamboré, na Avenida Piracema, 669. Os planos incluem o estacionamento do shopping por até 3 horas.'
- p: A NitroGym aceita TotalPass?
  r: 'Sim. A unidade Tamboré aparece no TotalPass a partir do plano TP 5.'
- p: A NitroGym aceita Gympass (Wellhub)?
  r: 'O guia não encontrou a unidade Tamboré no Wellhub, o antigo Gympass. Confirme no aplicativo antes de ir.'
- p: Qual o horário da NitroGym Tamboré?
  r: 'Das 5h à meia-noite de segunda a sexta, e das 6h às 22h aos sábados, domingos e feriados, segundo o site oficial.'
- p: Quem é o dono da NitroGym?
  r: 'O site oficial apresenta a NitroGym como a rede de academias de musculação criada por Sérgio Arnaut.'
- p: A NitroGym tem outras unidades?
  r: 'O site oficial lista duas: a do Shopping Tamboré, em Barueri, e a da Granja Viana, na Rodovia Raposo Tavares, km 22, em Cotia, aberta 24 horas. O plano anual dá acesso a duas unidades.'
divergencias:
- 'Horário de segunda a sexta: das 5h à meia-noite no site oficial; das 6h às 23h40 no TotalPass, que pode mostrar só a janela válida para usuários do agregador.'
pendencias:
- Qual é a segunda unidade incluída no plano anual
- Regras para personal trainer externo
analise:
- Fica dentro do Shopping Tamboré. Abre às 5h e fecha à meia-noite de segunda a sexta; nos fins de semana e feriados, das 6h às 22h. O estacionamento do shopping está incluso por até 3 horas em todos os planos.
- 'A tabela publicada é das mais completas da região: R$ 389 por mês no plano anual, R$ 489 no semestral, R$ 589 no mensal, R$ 289 num plano só de fim de semana e diária de R$ 90. É a única academia de musculação do guia com diária de preço publicado. Pelo TotalPass, o acesso começa no plano TP 5.'
