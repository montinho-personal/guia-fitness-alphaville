analise:
- Fica dentro do Shopping Tamboré. Abre às 5h e fecha à meia-noite de segunda a sexta; nos fins de semana e feriados, das 6h às 22h. O estacionamento do shopping está incluso por até 3 horas em todos os planos.
- 'A tabela publicada é das mais completas da região: R$ 389 por mês no plano anual, R$ 489 no semestral, R$ 589 no mensal, R$ 289 num plano só de fim de semana e diária de R$ 90. É a única academia de musculação do guia com diária de preço publicado. Pelo TotalPass, o acesso começa no plano TP 5.'
