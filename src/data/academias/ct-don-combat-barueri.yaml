analise:
- 'É um centro de lutas, não uma academia de musculação: a grade listada tem boxe e muay thai, e o texto da página cita também jiu-jitsu e aulas para crianças. Fica na Rua Damião Fernandes, no 2º andar, perto do centro de Barueri.'
- 'Quem procura "Killer Bees Barueri" deve chegar a este endereço: a página do Wellhub mantém esse nome no link, mas apresenta o espaço como CT Don Combat. Funciona das 6h às 22h de segunda a sexta e das 7h às 12h no sábado. No Wellhub, entra a partir do plano Silver.'
