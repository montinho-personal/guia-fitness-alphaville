analise:
- 'O endereço merece atenção: a academia fica no 2º pavimento do estacionamento da Sodimac, na Alameda Araguaia, 1801. No site oficial a unidade se chama Sodimac Alphaville; no TotalPass aparece como Smart Fit Alphaville II. Funciona das 6h às 23h de segunda a sexta, das 8h às 17h no sábado e em feriados e das 8h às 14h no domingo.'
- É a única unidade da Smart Fit da região sem o Plano Fit, o mais barato da rede. O plano de entrada aqui é o Smart, a R$ 149,90 por mês com fidelidade, R$ 10 abaixo do mesmo plano nas unidades de Barueri. O Plano Black, que dá acesso a toda a rede, tem adesão de R$ 9,90 nesta unidade, contra R$ 29,90 nas outras três. É também a única das quatro que informa estacionamento no site.
