analise:
- 'É uma escola de luta, não academia de musculação. O jiu-jitsu está no nome, e o TotalPass soma muay thai e boxe, com turmas femininas das duas. Fica numa loja do Mackenzie Mall, na Av. Tucunaré, a mesma avenida da Bluefit Tamboré. O Wellhub avisa que é preciso agendar a aula.'
- 'Nos agregadores, é das entradas mais caras entre as lutas da região: Gold no Wellhub e TP 4 no TotalPass. Abre das 6h às 22h nos dias úteis e só de manhã no sábado; no domingo, fecha.'
