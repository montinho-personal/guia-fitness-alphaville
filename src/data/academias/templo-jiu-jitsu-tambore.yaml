divergencias:
- 'Sábado: o Wellhub informa das 9h às 12h; o TotalPass, das 9h às 16h. A ficha usa o horário menor.'
- 'Telefone: o Wellhub mostra (11) 4208-7665 e o TotalPass, (11) 91008-9657.'
- 'Grade: o TotalPass lista boxe e muay thai; o Wellhub lista jiu-jitsu, condicionamento e aula particular de luta.'
