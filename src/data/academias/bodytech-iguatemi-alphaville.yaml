analise:
- A lista de atividades publicada passa de trinta itens, de musculação e corrida a balé, boxe, bike e pilates. É a oferta de aulas mais ampla entre as academias reunidas aqui.
- Dois pontos de atenção. A unidade não tem horário listado para domingo, e no sábado funciona das 9h às 15h. E o acesso pelo Wellhub no plano Silver vale apenas para horários específicos, segundo a própria página; quem pretende usar o agregador deve conferir quais são antes de contar com a academia no horário de pico.
