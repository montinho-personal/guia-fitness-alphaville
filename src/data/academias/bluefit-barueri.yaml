perguntas:
- p: 'Onde fica a Bluefit Barueri?'
  r: 'Na Av. Trindade, 344, em Bethaville I, em Barueri. Nas buscas, aparece também como Bluefit Bethaville.'
- p: 'Qual o horário da Bluefit Barueri?'
  r: 'Das 5h à meia-noite de segunda a sexta, das 8h às 16h no sábado e das 10h às 16h no domingo, segundo as fontes da ficha.'
- p: 'Quanto é a mensalidade da Bluefit?'
  r: 'O site da rede anuncia planos a partir de R$ 119,90 por mês; o valor exato de cada plano da unidade aparece na página de matrícula e pode variar. Confira antes de assinar.'
- p: 'A Bluefit aceita Gympass (Wellhub)?'
  r: 'Sim. Esta unidade entra no Wellhub a partir do plano Silver+, de R$ 199,99 por mês.'
- p: 'A Bluefit aceita TotalPass?'
  r: 'O guia não encontrou esta unidade no TotalPass.'
analise:
- Abre das 5h às 23h59 de segunda a sexta. No sábado funciona das 8h às 16h, e no domingo, das 10h às 16h.
- Além da musculação, a grade listada inclui muay thai, jiu-jitsu e aulas em grupo. A página da unidade registra itens de acessibilidade — banheiro, chuveiro e estacionamento acessíveis — que nem todas as academias da região informam. No Wellhub, o acesso começa no plano Silver+.
