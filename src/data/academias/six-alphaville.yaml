pendencias:
- Mensalidade atual, que a SIX não publica no site
- 'Posição exata no mapa: a usada é a do conjunto Empresarial 18 do Forte'
analise:
- 'A SIX abriu em outubro de 2026 no rooftop do 23º andar do Empresarial 18 do Forte, com 1.500 m² e vista para Alphaville. Não é uma academia comum: além da musculação e das aulas de ballet fitness, boxe, spinning, dança, pilates e hot yoga, tem spa, recovery, salão de beleza, bar e valet gratuito para membros. Funciona das 6h às 22h em dias úteis, das 8h às 15h no sábado e das 8h às 14h no domingo.'
- A rede não publica preço no site; a matrícula começa por uma visita agendada. Em reportagem da Exame de agosto de 2026, antes da inauguração, o cofundador citou o plano semestral de Alphaville em seis parcelas de R$ 3.900, mais adesão de R$ 600, e contratos de 15 meses vendidos na pré-venda a partir de R$ 2.200, com expectativa de cerca de R$ 2.700 na abertura. São valores informados à imprensa, não uma tabela oficial, e podem ter mudado. Mesmo assim, colocam a SIX muito acima de qualquer outra academia do guia.
