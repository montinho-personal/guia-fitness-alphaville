divergencias:
- 'Horário de sábado: até 23h no site oficial; até 18h no Wellhub e no TotalPass, que podem mostrar só a janela dos agregadores.'
- 'Endereço: o TotalPass cita "Rua Mario Quintana, 144 ou 138, Melville Empresarial I e II"; o site oficial e o Wellhub, o número 144.'
