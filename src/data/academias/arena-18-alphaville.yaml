analise:
- É a única academia deste guia que junta treino e esportes de areia no mesmo endereço. Além da sala de musculação e de um estúdio de funcional com HIIT, mobilidade e o método Five, a Arena 18 tem quadras de areia para beach tennis, futevôlei e vôlei.
- 'A lista de estrutura informada ao Wellhub é das mais longas do guia: sauna, banho de gelo, spa e massagem, fisioterapeuta, nutricionista, cafeteria, área infantil e espaço de coworking, além de estacionamento. Funciona das 5h às 23h em dias úteis; no fim de semana o site oficial informa 8h às 23h no sábado e 8h às 18h no domingo, e os agregadores mostram o sábado só até as 18h.'
- Fica na Rua Mario Quintana, no Melville Empresarial, ao norte de Alphaville. A academia não publica mensalidade. Pelos agregadores, entra a partir do plano Gold do Wellhub e do TP 4 do TotalPass, faixa das academias de padrão mais alto da região.
