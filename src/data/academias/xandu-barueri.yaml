analise:
- Fica na Rua Copo de Leite, no Jardim Florida, a poucas quadras da Prefeitura de Barueri. Funciona das 6h às 22h de segunda a sexta e das 8h às 13h no sábado; não há horário listado para domingo.
- Além da musculação, a grade tem jump, zumba, dança sertaneja e bike. É a única academia do guia que entra no plano Starter do Wellhub, o mais barato do agregador, a R$ 39,99 por mês.
