analise:
- 'Fica no Carrefour Hiper Tamboré, na Alameda Araguaia, 2751, a menos de 1 km da unidade da Sodimac, na mesma alameda. Apesar do nome Tamboré, o endereço oficial é Alphaville Industrial. Funciona das 6h às 23h nos dias úteis, das 8h às 17h no sábado e nos feriados e das 8h às 14h no domingo.'
- 'Tem o Plano Fit mais barato entre as Smart Fit com ficha no guia: R$ 129,90 por mês com fidelidade, contra R$ 139,90 nas unidades de Barueri, mas cobra adesão de R$ 29,90, que lá é grátis. No TotalPass, entra pelo TP 2.'
